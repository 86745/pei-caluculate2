<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <title>PEI計算機</title>
  <style>
    :root { color-scheme: light; --navy:#17324d; --blue:#2867a8; --bg:#f3f6fa; --muted:#5d6b79; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:#17212b; }
    main { width:min(100% - 28px, 460px); margin:32px auto; }
    .card { background:#fff; border-radius:20px; padding:24px; box-shadow:0 8px 28px #18324d14; }
    h1 { margin:0 0 8px; font-size:1.65rem; color:var(--navy); }
    .intro { margin:0 0 22px; color:var(--muted); line-height:1.6; font-size:.95rem; }
    label { display:block; font-weight:650; margin:16px 0 7px; }
    input { display:block; width:100%; padding:13px 14px; font:inherit; border:1px solid #c7d1dc; border-radius:11px; background:#fff; }
    input:focus { outline:3px solid #2867a82b; border-color:var(--blue); }
    button { width:100%; margin-top:22px; border:0; border-radius:12px; padding:14px; color:white; background:var(--blue); font:inherit; font-weight:700; cursor:pointer; }
    button:active { transform:translateY(1px); }
    .result { margin-top:20px; padding:17px; border-radius:12px; background:#edf4fb; }
    .result-label { color:var(--muted); font-size:.9rem; }
    output { display:block; margin-top:5px; color:var(--navy); font-size:1.8rem; font-weight:750; overflow-wrap:anywhere; }
    .error { color:#b42318; font-size:.92rem; margin-top:12px; }
    .note { margin:18px 2px 0; color:var(--muted); font-size:.82rem; line-height:1.6; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin:18px 0; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>PEI計算機</h1>
      <p class="intro">F・I・Kの値を入力して「計算する」を押してください。</p>

      <form id="pei-form">
        <label for="f">Fの値</label>
        <input id="f" name="f" type="number" step="any" inputmode="decimal" required>

        <label for="i">Iの値</label>
        <input id="i" name="i" type="number" step="any" inputmode="decimal" required>

        <label for="k">Kの値</label>
        <input id="k" name="k" type="number" step="any" inputmode="decimal" required>

        <button type="submit">計算する</button>
      </form>

      <div class="result" aria-live="polite">
        <div class="result-label">計算結果</div>
        <output id="result">PEI = —</output>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <p class="note">※以前のPythonコードで使用していた計算式を実装しています。研究で使用する前に、式と単位が目的に合っているか確認してください。</p>
    </section>
    <footer>PEI Calculator</footer>
  </main>
  <script>
    const form = document.getElementById('pei-form');
    const resultOutput = document.getElementById('result');
    const errorOutput = document.getElementById('error');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorOutput.hidden = true;

      const F = Number(document.getElementById('f').value);
      const I = Number(document.getElementById('i').value);
      const K = Number(document.getElementById('k').value);

      if (![F, I, K].every(Number.isFinite)) {
        errorOutput.textContent = 'F・I・Kに有効な数値を入力してください。';
        errorOutput.hidden = false;
        return;
      }
      if (I === -3) {
        errorOutput.textContent = 'I = -3 では分母が0になるため計算できません。';
        errorOutput.hidden = false;
        return;
      }
      const radicand = (I + 5) / 10;
      if (radicand < 0) {
        errorOutput.textContent = '(I + 5) / 10 が負になるため、実数として計算できません。';
        errorOutput.hidden = false;
        return;
      }

      const result = Math.sqrt(radicand) * 100 * K * ((F + 3) / (I + 3) - 1);
      if (!Number.isFinite(result)) {
        errorOutput.textContent = '計算結果を表示できません。入力値を確認してください。';
        errorOutput.hidden = false;
        return;
      }
      resultOutput.textContent = `PEI = ${result.toFixed(2)}`;
    });
  </script>
</body>
</html>
